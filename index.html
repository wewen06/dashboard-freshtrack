<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FreshTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<script>
// tema dipasang sebelum render agar tidak berkedip
(function(){
  var t; try { t = localStorage.getItem("ft-theme"); } catch(e) {}
  if (!t) t = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#f3f6f6; --bg2:#e8f0f0; --surface:#ffffff; --ink:#14202a; --mute:#75858f; --line:#e4eaec;
  --temp:#3a86a6; --shadow:0 1px 2px rgba(20,32,42,.04),0 12px 32px -12px rgba(20,32,42,.10);
  --aman:#2f9e6e; --waspada:#d49a1c; --jual:#d85c4b; --exp:#9b3434;
  --btn:#14202a; --btnt:#fff; --st:var(--aman);
}
[data-theme="dark"]{
  --bg:#0b1115; --bg2:#101a20; --surface:#121b21; --ink:#e9eff2; --mute:#80909a; --line:#1f2b33;
  --temp:#72b9d6; --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
  --aman:#4cc38a; --waspada:#e6b23e; --jual:#ef7a69; --exp:#c75a5a;
  --btn:#e9eff2; --btnt:#0b1115;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);
  background:radial-gradient(1200px 500px at 50% -10%,var(--bg2),var(--bg) 70%) var(--bg);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.5;
  transition:background-color .35s,color .35s}
main{max-width:860px;margin:0 auto;padding:26px 20px 56px}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
.brand{font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand svg{width:20px;height:20px;stroke:var(--temp);fill:none;stroke-width:1.6;stroke-linecap:round}
.right{display:flex;align-items:center;gap:16px}
.conn{display:flex;gap:16px;font-size:.8rem;color:var(--mute)}
.conn span{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);transition:background .3s,box-shadow .3s}
.dot.on{background:var(--aman);box-shadow:0 0 0 3px color-mix(in srgb,var(--aman) 22%,transparent)}
.dot.off{background:var(--jual)}
#theme{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:50%}
#theme svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[data-theme="light"] .sun{display:none}
[data-theme="dark"] .moon{display:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  transition:background-color .35s,border-color .35s}
.hero{padding:34px 32px 30px}
.product{color:var(--mute);font-size:.95rem}
.big{font-size:clamp(3rem,11vw,5.6rem);font-weight:200;letter-spacing:-.04em;line-height:1.05;margin:8px 0 26px}
.big small{font-size:.28em;font-weight:400;color:var(--mute);letter-spacing:0;margin:0 .6em 0 .18em}
.track{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:var(--st);border-radius:6px;transition:width .7s cubic-bezier(.4,0,.2,1),background .4s}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--st);
  background:color-mix(in srgb,var(--st) 12%,transparent);padding:4px 12px 4px 10px;border-radius:99px;transition:color .4s,background .4s}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.meta span{color:var(--mute)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stat{padding:22px 32px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat span{display:block;font-size:.8rem;color:var(--mute);margin-bottom:2px}
.stat b{font-size:1.7rem;font-weight:300;letter-spacing:-.025em}
.stat i{font-style:normal;font-size:.85rem;color:var(--mute);margin-left:3px}

.chart{margin-top:16px;padding:22px 26px 18px}
.legend{display:flex;gap:20px;font-size:.8rem;color:var(--mute);margin-bottom:12px}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;border-radius:2px;margin-right:7px;vertical-align:middle;background:currentColor}
.legend .a{color:var(--temp)}.legend .b{color:var(--st);transition:color .4s}
svg.c{width:100%;height:auto;display:block;overflow:visible}
svg.c path{fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
#lt{stroke:var(--temp)}#lp{stroke:var(--st);transition:stroke .4s}
#ap{fill:var(--st);opacity:.08;stroke:none!important;transition:fill .4s}
.grid{stroke:var(--line)}
.empty{fill:var(--mute);font-size:12px}

.actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
button{font:inherit;font-size:.9rem;font-weight:500;padding:10px 20px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:background .2s,transform .1s,opacity .2s,border-color .2s}
button:hover{border-color:var(--mute)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--temp);outline-offset:2px}
button.p{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
button.p:hover{opacity:.88}
#log{margin-top:14px;font-size:.82rem;color:var(--mute);min-height:1.3em}

@media(max-width:560px){
  .hero{padding:26px 22px 24px}
  .stat{padding:18px 14px}.stat:first-child{padding-left:22px}
  .stat b{font-size:1.25rem}
  .conn em{display:none}
  .chart{padding:18px 16px 14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9M9 4.5l3 2 3-2M9 19.5l3-2 3 2"/></svg>
      FreshTrack
    </div>
    <div class="right">
      <div class="conn">
        <span title="Broker"><i class="dot" id="dMqtt"></i><em id="tMqtt" style="font-style:normal">Broker</em></span>
        <span title="Perangkat"><i class="dot" id="dDev"></i><em id="tDev" style="font-style:normal">Perangkat</em></span>
      </div>
      <button id="theme" aria-label="Ganti tema" onclick="gantiTema()">
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="panel">
    <div class="hero">
      <div class="product" id="produk">Menunggu data…</div>
      <div class="big" id="sisa">–</div>
      <div class="track"><div class="fill" id="bar"></div></div>
      <div class="meta"><b class="chip" id="status">Menunggu</b><span id="persen">–</span></div>
    </div>
    <div class="stats">
      <div class="stat"><span>Suhu</span><b id="suhu">–</b></div>
      <div class="stat"><span>Kelembapan</span><b id="lembap">–</b></div>
      <div class="stat"><span>Laju susut</span><b id="laju">–</b></div>
    </div>
  </section>

  <section class="panel chart">
    <div class="legend"><span class="a">Suhu</span><span class="b">Sisa umur simpan</span></div>
    <svg class="c" viewBox="0 0 800 220" role="img" aria-label="Grafik suhu dan sisa umur simpan">
      <line class="grid" x1="0" y1="219" x2="800" y2="219"/>
      <line class="grid" x1="0" y1="110" x2="800" y2="110" stroke-dasharray="2 6"/>
      <path id="ap" d=""/><path id="lt" d=""/><path id="lp" d=""/>
      <text class="empty" id="emptyTxt" x="400" y="115" text-anchor="middle">Grafik muncul setelah data pertama diterima</text>
    </svg>
  </section>

  <div class="actions">
    <button class="p" onclick="kirim('reset')">Batch baru</button>
    <button onclick="kirim('ganti')">Ganti produk</button>
  </div>
  <div id="log" aria-live="polite"></div>
</main>

<script>
// ===== Konfigurasi: TOPIC_BASE harus sama dengan sketch.ino =====
const TOPIC_BASE = "scm/freshtrack/kelompokX";
const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
const MAX_POINTS = 90;      // ±3 menit data (publish tiap 2 detik)
const STALE_MS   = 7000;    // dianggap tidak ada data baru

const T_DATA = TOPIC_BASE + "/data", T_STATUS = TOPIC_BASE + "/status", T_CMD = TOPIC_BASE + "/cmd";
const $ = id => document.getElementById(id);
const VAR   = { AMAN:"--aman", WASPADA:"--waspada", JUAL:"--jual", EXP:"--exp" };
const LABEL = { AMAN:"Aman", WASPADA:"Waspada", JUAL:"Jual segera", EXP:"Kedaluwarsa" };

let temps = [], pcts = [], lastData = 0, devOnline = false;

// ----- tema -----
function gantiTema(){
  const root = document.documentElement;
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("ft-theme", next); } catch(e) {}
}

// ----- MQTT -----
function dot(id, txt, cls){ $("d"+id).className = "dot " + cls; $("t"+id).textContent = txt; }

const client = mqtt.connect(BROKER_URL, {
  clientId: "web-" + Math.random().toString(16).slice(2, 10),
  reconnectPeriod: 3000, keepalive: 30
});
client.on("connect", () => { dot("Mqtt","Broker tersambung","on"); client.subscribe([T_DATA, T_STATUS]); });
client.on("reconnect", () => dot("Mqtt","Menyambung ulang…",""));
client.on("close", () => dot("Mqtt","Broker putus","off"));
client.on("error", e => $("log").textContent = "Error: " + e.message);

client.on("message", (topic, payload) => {
  const msg = payload.toString();
  if (topic === T_STATUS) {
    devOnline = msg === "online";
    dot("Dev", devOnline ? "Perangkat online" : "Perangkat offline", devOnline ? "on" : "off");
  } else if (topic === T_DATA) {
    try { render(JSON.parse(msg)); lastData = Date.now(); } catch { console.error("JSON salah", msg); }
  }
});

setInterval(() => {
  if (lastData && Date.now() - lastData > STALE_MS && devOnline) dot("Dev","Tidak ada data baru","");
}, 2000);

// ----- tampilan -----
function waktu(jam){
  if (jam <= 0) return "Kedaluwarsa";
  const h = Math.floor(jam / 24), j = Math.floor(jam % 24);
  return h > 0 ? `${h}<small>hari</small>${j}<small>jam</small>` : `${j}<small>jam</small>`;
}

function render(d){
  document.documentElement.style.setProperty("--st", `var(${VAR[d.status] || VAR.AMAN})`);

  $("produk").textContent = d.produk;
  $("sisa").innerHTML = waktu(d.sisa_jam);
  $("bar").style.width = Math.max(0, Math.min(100, d.persen)) + "%";
  $("status").textContent = LABEL[d.status] || d.status;
  $("persen").textContent = d.persen.toFixed(1) + "% tersisa";

  $("suhu").innerHTML   = d.suhu.toFixed(1) + "<i>°C</i>";
  $("lembap").innerHTML = d.lembap.toFixed(0) + "<i>%</i>";
  $("laju").innerHTML   = d.laju.toFixed(2) + "<i>×</i>";

  temps.push(d.suhu); pcts.push(d.persen);
  if (temps.length > MAX_POINTS){ temps.shift(); pcts.shift(); }
  gambar();
}

const W = 800, H = 200, PAD = 10;
function pts(arr, lo, hi){
  const span = (hi - lo) || 1, off = W - (arr.length - 1) / (MAX_POINTS - 1) * W;
  return arr.map((v, i) => [
    (i / (MAX_POINTS - 1)) * W + off,
    PAD + (H - 2 * PAD) * (1 - (v - lo) / span)
  ]);
}
const line = p => p.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join("");

function gambar(){
  if (temps.length < 2) return;
  $("emptyTxt").style.display = "none";
  const lo = Math.min(...temps) - 1, hi = Math.max(...temps) + 1;
  const p = pts(pcts, 0, 100);
  $("lt").setAttribute("d", line(pts(temps, lo, hi)));
  $("lp").setAttribute("d", line(p));
  $("ap").setAttribute("d", line(p) + `L${p[p.length-1][0].toFixed(1)} ${H+PAD}L${p[0][0].toFixed(1)} ${H+PAD}Z`);
}

function kirim(cmd){
  if (!client.connected) { $("log").textContent = "Broker belum tersambung."; return; }
  client.publish(T_CMD, cmd);
  $("log").textContent = (cmd === "reset" ? "Batch baru" : "Ganti produk") + " terkirim, " + new Date().toLocaleTimeString("id-ID");
}
</script>
</body>
</html>
